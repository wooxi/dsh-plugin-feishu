name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Verify bundle manifest
        run: |
          node -e "
          const p = require('./package.json');
          if (!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch is required');
          if (p.type !== 'module') throw new Error('plugin must be ESM');
          if (!p.files?.length) throw new Error('files whitelist is required');
          console.log('bundle manifest OK');
          "
